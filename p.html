<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrindo...</title><meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f6f8f7;color:#102b4e;padding:20px;box-sizing:border-box}
#p{box-sizing:border-box;max-width:380px;width:100%;background:#fff;border:1px solid #e3e9e7;border-radius:16px;padding:26px;text-align:center;display:grid;gap:12px}
h1{font-size:21px;margin:0}p{margin:0;color:#5a6675}small{color:#067d75;font-weight:600}
.btn{box-sizing:border-box;display:block;background:#067d75;color:#fff;text-decoration:none;border:0;border-radius:10px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;width:100%}
.btn.ghost{background:#fff;color:#067d75;border:1px solid #067d75}
details{text-align:left;font-size:14px}summary{cursor:pointer;color:#5a6675;text-align:center}
form{display:grid;gap:8px;margin-top:10px}textarea,input:not([type=radio]){font:inherit;padding:10px;border:1px solid #e3e9e7;border-radius:9px}textarea{min-height:80px}
.stars{display:flex;justify-content:center;gap:4px;flex-direction:row-reverse}.stars input{display:none}.stars span{font-size:30px;color:#d5dbd9;cursor:pointer}
.stars label:has(input:checked) span,.stars label:has(input:checked)~label span{color:#f2b631}
.spin{width:28px;height:28px;border:3px solid #dcefec;border-top-color:#067d75;border-radius:50%;margin:auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head>
<body><main id="p"><div class="spin"></div><p>Abrindo...</p></main>
<script type="module" src="/assets/js/p.js"></script></body></html>
